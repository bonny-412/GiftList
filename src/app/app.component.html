<header class="hero">
  <div class="snow" aria-hidden="true"></div>
  @if (isChristmas) {
    <div id="santa" aria-hidden="true">
      <img src="assets/images/santa-claus.svg" alt="">
    </div>
  }
  <div class="page-width hero-inner">
    <div>
      <h1>Lista regali <span class="font-christmas">Bonny</span></h1>
      <p>Scorri, scegli, sorprendi… e rendi Bonny super felice!</p>
      <app-button-sound/>
    </div>
    <div class="hero-art max-[576px]:mt-10" aria-hidden="true">
      <span class="fir-branch fir-branch-left"></span>
      <span class="fir-branch fir-branch-right"></span>
      <span class="hero-lights"></span>
      <img class="hero-santa" src="assets/images/santa2-min.png" alt="">
    </div>
    <div class="hero-countdowns">
      <app-countdown [isChristmas]="true"></app-countdown>
      <app-countdown [isChristmas]="false"></app-countdown>
    </div>
  </div>
</header>

<main class="page-width gift-list">
  <h2><span class="holly" aria-hidden="true"></span>La lista dei regali</h2>
  <app-gifts></app-gifts>
</main>

<footer>
  <div class="snow" aria-hidden="true"></div>
  <span class="gift-bow" aria-hidden="true"><span></span></span>
  <p>Powered by <a href="https://abonaiuti.netlify.app/" target="_blank" rel="noopener"><b>Andrea Bonaiuti</b></a></p>
</footer>
