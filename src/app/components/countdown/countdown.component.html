<div class="countdown" [class.countdown-christmas]="isChristmas">
  <img class="h-6 w-6 shrink-0" [src]="urlIconCountdown" alt="">
  <div>
    <p class="occasion">
      <span class="font-bold">{{ isChristmas ? 'Natale' : 'Compleanno' }}</span>
      @if (isChristmas) {
        <time datetime="12-25">25 dicembre</time>
      }
    </p>
    <p class="text-sm font-bold tabular-nums">
      {{ days }} g · {{ hours }} h<span class="countdown-detail" [class.countdown-detail-urgent]="days === 0 && hours === 0"> · {{ minutes }} min · {{ seconds }} s</span>
    </p>
  </div>
</div>
