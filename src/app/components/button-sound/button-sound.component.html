<audio #music src="assets/audio.mp3" preload="none"
  (playing)="isAudioOn = true" (pause)="isAudioOn = false" (ended)="isAudioOn = false"></audio>

<button type="button" class="music-button" aria-label="Musica" [attr.aria-pressed]="isAudioOn"
  [disabled]="playbackPending" (click)="toggleSound(music)">
  <img src="assets/images/bell.svg" alt="">
  <span aria-hidden="true">Musica {{ isAudioOn ? 'attiva' : 'disattivata' }}</span>
</button>
@if (playbackFailed) {
  <p class="music-error" role="status">Musica non disponibile. Riprova.</p>
}
