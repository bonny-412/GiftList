<div class="gift-grid">
  @for (item of gifts; track item; let index = $index) {
    <app-gift-item [giftBean]="item" [eagerImage]="index < 4" [priorityImage]="index < 2"></app-gift-item>
  } @empty {
    <p class="empty-state">Nessun regalo disponibile.</p>
  }
</div>

@if (contribution; as paypal) {
  <section class="contribution" aria-labelledby="contribution-title">
    <div class="contribution-media">
      <img [src]="'assets/images-gift/' + paypal.img" alt="Codice QR per contribuire con PayPal" loading="lazy">
    </div>
    <div>
      <h3 id="contribution-title">Preferisci un contributo?</h3>
      @if (paypal.note) {
        <p>{{ paypal.note }}</p>
      }
      <a class="gift-action" [href]="paypal.url" target="_blank" rel="noopener"
        aria-label="Contribuisci: apri il QR PayPal in una nuova scheda">
        Contribuisci
        <span class="qr-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </a>
    </div>
  </section>
}
