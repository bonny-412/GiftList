<div class="gift-controls">
  <p class="gift-count" role="status">
    {{ filteredList.length }} {{ filteredList.length === 1 ? 'regalo' : 'regali' }}
  </p>
  <details>
    <summary>Cerca e ordina</summary>
    <div class="gift-toolbar">
      <div class="gift-search">
        <label for="gift-search">Cerca regalo</label>
        <div class="relative">
          <input #searchInput id="gift-search" [(ngModel)]="searchTitle" (input)="onSearchGift()"
            placeholder="Cerca per nome">
          @if (searchTitle.trim()) {
            <button type="button" class="clear-search" aria-label="Cancella ricerca" (click)="onRemoveFilter(); searchInput.focus()">
              <span aria-hidden="true">×</span>
            </button>
          }
        </div>
      </div>
      <div class="gift-sort">
        <label for="gift-sort">Ordina per</label>
        <select id="gift-sort" (change)="onChangeOrder($event)">
          @for (item of sortRecipesOption; track item.value) {
            <option [value]="item.value" [selected]="item.value === typeSortRecipes">{{ item.label }}</option>
          }
        </select>
      </div>
    </div>
  </details>
</div>

<div class="gift-grid">
  @for (item of filteredList; track item) {
    <app-gift-item [giftBean]="item"></app-gift-item>
  } @empty {
    <div class="empty-state">
      <p>Nessun regalo trovato.</p>
      @if (searchTitle.trim()) {
        <button type="button" class="reset-search" (click)="onRemoveFilter(); searchInput.focus()">Azzera ricerca</button>
      }
    </div>
  }
</div>
